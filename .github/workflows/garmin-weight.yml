name: Garmin Weight Export

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First date to retrieve (YYYY-MM-DD)"
        required: true
        default: "2012-01-01"
      end_date:
        description: "Last date (YYYY-MM-DD); leave blank for today"
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  export-weight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Garmin Personal API client
        run: python -m pip install -r garmin/requirements.txt

      - name: Retrieve weight measurements
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          GARMIN_START_DATE: ${{ inputs.start_date }}
          GARMIN_END_DATE: ${{ inputs.end_date }}
        run: |
          START_DATE="${GARMIN_START_DATE:-2012-01-01}"
          END_ARGS=()
          if [ -n "$GARMIN_END_DATE" ]; then
            END_ARGS=(--end-date "$GARMIN_END_DATE")
          fi
          python garmin/export_weight.py \
            --start-date "$START_DATE" \
            "${END_ARGS[@]}" \
            --output garmin/data/weight-measurements.json

      - name: Commit updated weight history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garmin/data/weight-measurements.json
          if git diff --cached --quiet; then
            echo "No weight-data changes to commit."
          else
            git commit -m "Update Garmin weight history"
            git push
          fi
